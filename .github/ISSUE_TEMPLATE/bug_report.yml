name: Bug report
description: Report a problem opening, editing, or saving an FH3 save.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: Please describe the problem without uploading personal save files or account information.
  - type: input
    id: version
    attributes:
      label: Editor version
      placeholder: "1.0"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Which file type, editor tab, and save action were used?
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
      description: Include the error message if one appeared. Remove personal paths and account identifiers.
    validations:
      required: true
